  RUN_DIRECTORY: "."
  TARGET: "."
  REPORT_NAME: checkov.sarif
  SO_BRANCH_NAME: $CI_COMMIT_REF_NAME

gitleaks:
  SCANNER: gitleaks
  RUN_DIRECTORY: "."
  REPORT_NAME: "gitleaks.sarif"
  SO_BRANCH_NAME: $CI_COMMIT_REF_NAME

kics:
  SCANNER: kics
  RUN_DIRECTORY: "."
  TARGET: "."
  REPORT_NAME: "kics.sarif"
  SO_BRANCH_NAME: $CI_COMMIT_REF_NAME

semgrep:
  SCANNER: semgrep
  RUN_DIRECTORY: "."
  TARGET: "."
  CONFIGURATION: "r/typescript"
  REPORT_NAME: "semgrep.sarif"
  SO_BRANCH_NAME: $CI_COMMIT_REF_NAME

trivy_filesystem:
  SCANNER: trivy_filesystem
  RUN_DIRECTORY: "."
