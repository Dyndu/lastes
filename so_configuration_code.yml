  SO_BRANCH_NAME: $CI_COMMIT_REF_NAME

trivy_misconfig:
  SCANNER: trivy_config
  RUN_DIRECTORY: "."
  TARGET: "."
  REPORT_NAME: "trivy_misconfig.json"
  SO_BRANCH_NAME: $CI_COMMIT_REF_NAME

trivy_secrets:
  SCANNER: trivy_filesystem_secrets
  RUN_DIRECTORY: "."
  TARGET: "."
  REPORT_NAME: "trivy_secrets.json"
  SO_BRANCH_NAME: $CI_COMMIT_REF_NAME

importer:
  SO_UPLOAD: "true"
  SO_API_BASE_URL: https://obsbk.hwegbe.com
